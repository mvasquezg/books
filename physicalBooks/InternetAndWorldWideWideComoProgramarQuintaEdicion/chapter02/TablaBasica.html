<!DOCTYPE html>

<!--Creacion de una tabla básica-->
<html>
    <head>
        <meta charset="UTF-8">
        <title>Tabla B&aacute;sica</title>
    </head>
    <body>
        <h1>Tabla B&aacute;sica</h1>
        
            


        <table border="1">
            
            <!-- la etiqueta <caption> sintentiza el contenido de-->
            <!-- la tabla (esto ayuda a las personas con discapacidad visual)-->
            <caption>
                <strong>
                    Tabla de frutas (1ra columna) y sus precios (2da columna).
                </strong>  
            </caption>
            
            <!-- la seccion de thead aparece primero en la tabla -->
            <!-- da formato al área del encabezado de la tabla-->
            <thead>
                <tr><!--<tr> inserta una fila en la tabla -->
                    <th>Fruta</th>
                    <th>Precio</th>
                </tr>
            </thead>

            <!-- la seccion <tfoot> aparace al último en la tabla-->
            <!-- da formato al pie de la tabla-->    
            <tfoot>
                <tr>
                    <th >Total</th>
                    <th>$ 3.75</th>
                
                </tr>
            </tfoot>

            <!-- Todo el contenido de la tabla está encerrado en <tbody> -->
            <!-- dentro del elemento <tbody> -->
            <tbody>
                <tr>
                    <td>Manzana</td>
                    <td>$ 0.25</td>
                </tr>
                <tr>
                    <td>Naranja</td>
                    <td>$ 0.50</td>
                </tr>
                <tr>
                    <td>Pl&aacute;tano</td>
                    <td>$ 1.00</td>
                </tr>
                <tr>
                    <td>Pi&ntilde;a</td>
                    <td>$ 2.00</td>
            </tbody>
        </table>
    </body>
</html>
